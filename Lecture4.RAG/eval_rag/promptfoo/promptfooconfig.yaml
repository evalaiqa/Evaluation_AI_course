# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Запускайте из папки eval_rag, чтобы автоматически подхватился .env:
#   cd eval_rag
#   promptfoo eval -c promptfoo/promptfooconfig.yaml
#
# Переменные берутся из .env (см. eval_rag/.env.example):
#   RAG_ENDPOINT_URL, RAG_API_KEY  — адрес и ключ RAG-системы
#   PROXY_BASE_URL, PROXY_API_KEY  — прокси для LLM-судьи и эмбеддингов
description: first RAG eval
env: {}
extensions: []
prompts:
  - '{{query}}'
providers:
  - id: http
    label: RAG API
    config:
      url: '{{ env.RAG_ENDPOINT_URL }}'
      method: POST
      headers:
        Content-Type: application/json
      auth:
        type: api_key
        keyName: X-API-Key
        value: '{{ env.RAG_API_KEY }}'
        placement: header
      body:
        message: '{{prompt}}'
      stateful: false
      transformResponse: |
        ({
          output: json.content || '',
          metadata: {
            retrieved_docs: json.sources || [],
            retrieval_context: (json.sources || [])
              .map(source => source.content)
              .filter(Boolean)
          }
        })
scenarios: []
tests:
  - description: Статусы заказа и остатки на складе
    vars:
      query: >-
        Я пишу тест-кейсы для модуля управления заказами в приложении и
        постоянно путаюсь в том, что происходит со статусом заказа в разных
        сценариях. Можешь объяснить, какие вообще бывают статусы заказа, и чем
        именно отличается заказ, который был завершён, от заказа, отменённого
        пользователем — особенно в части того, что происходит с остатками на
        складе?
  - description: Процесс согласования товара
    vars:
      query: >-
        Мне только что назначили роль суперадмина, и я ещё не разобрался с
        новым процессом согласования товаров. Можешь объяснить, как мне
        одобрить или отклонить заявку на товар, ожидающую рассмотрения, кто
        ещё, кроме меня, видит этот экран, и что на самом деле происходит в
        системе в зависимости от того, какое действие я выберу?
evaluateOptions: {}
defaultTest:
  options:
    provider:
      text:
        id: openai:chat:gpt-4o-mini
        config:
          apiBaseUrl: '{{ env.PROXY_BASE_URL }}'
          apiKey: '{{ env.PROXY_API_KEY }}'
      embedding:
        id: openai:embedding:text-embedding-3-small
        config:
          apiBaseUrl: '{{ env.PROXY_BASE_URL }}'
          apiKey: '{{ env.PROXY_API_KEY }}'
  assert:
    - type: answer-relevance
      threshold: 0.7
      metric: answer_relevance
    - type: context-faithfulness
      threshold: 0.8
      metric: context_faithfulness
      contextTransform: context.metadata.retrieval_context
    - type: context-relevance
      threshold: 0.5
      metric: context_relevance
      contextTransform: context.metadata.retrieval_context
derivedMetrics: []
